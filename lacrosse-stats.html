<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lacrosse Stat Tracker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px;
        }

        /* Header / Scoreboard */
        .scoreboard {
            background: linear-gradient(135deg, #16213e, #1a1a2e);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #0f3460;
        }

        .score-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }

        .team-score {
            flex: 1;
        }

        .team-name {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 5px;
            cursor: pointer;
        }

        .team-name:hover {
            color: #e94560;
        }

        .score {
            font-size: 48px;
            font-weight: bold;
        }

        .home-score { color: #3b82f6; }
        .away-score { color: #ef4444; }

        .game-info {
            text-align: center;
            padding: 0 20px;
        }

        .period {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .clock {
            font-size: 36px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            color: #22c55e;
        }

        .clock.stopped {
            color: #ef4444;
        }

        .clock-controls {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .clock-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .btn-start { background: #22c55e; color: #fff; }
        .btn-stop { background: #ef4444; color: #fff; }
        .btn-reset { background: #6b7280; color: #fff; }
        .btn-period { background: #8b5cf6; color: #fff; }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            overflow-x: auto;
        }

        .nav-tab {
            padding: 10px 16px;
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
        }

        .nav-tab.active {
            background: #e94560;
            color: #fff;
            border-color: #e94560;
        }

        /* Panels */
        .panel {
            display: none;
            background: #16213e;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #0f3460;
        }

        .panel.active {
            display: block;
        }

        .panel-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #e94560;
        }

        /* Setup Panel */
        .setup-section {
            margin-bottom: 20px;
        }

        .setup-section h3 {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 10px;
            border: 1px solid #0f3460;
            border-radius: 6px;
            background: #1a1a2e;
            color: #fff;
            font-size: 14px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .btn-primary { background: #e94560; color: #fff; }
        .btn-secondary { background: #0f3460; color: #fff; }
        .btn-success { background: #22c55e; color: #fff; }
        .btn-danger { background: #ef4444; color: #fff; }

        .roster-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .roster-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #1a1a2e;
            border-radius: 6px;
            margin-bottom: 5px;
        }

        .roster-item .number {
            font-weight: bold;
            color: #e94560;
            margin-right: 10px;
        }

        .roster-item .remove-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 18px;
        }

        /* Live Stats Panel */
        .team-toggle {
            display: flex;
            margin-bottom: 15px;
        }

        .team-toggle button {
            flex: 1;
            padding: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .team-toggle .home-btn {
            background: #1e3a5f;
            color: #3b82f6;
            border-radius: 8px 0 0 8px;
        }

        .team-toggle .away-btn {
            background: #3d1f1f;
            color: #ef4444;
            border-radius: 0 8px 8px 0;
        }

        .team-toggle button.active {
            background: #3b82f6;
            color: #fff;
        }

        .team-toggle .away-btn.active {
            background: #ef4444;
        }

        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
            margin-bottom: 15px;
        }

        .player-btn {
            padding: 12px 8px;
            background: #1a1a2e;
            border: 2px solid #0f3460;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            text-align: center;
        }

        .player-btn.selected {
            border-color: #e94560;
            background: #2d1f3d;
        }

        .player-btn .num {
            font-size: 20px;
            font-weight: bold;
            display: block;
        }

        .player-btn .name {
            font-size: 10px;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stat-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .stat-btn {
            padding: 15px 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .stat-btn .icon {
            font-size: 20px;
        }

        .stat-btn.goal { background: #22c55e; }
        .stat-btn.assist { background: #3b82f6; }
        .stat-btn.shot { background: #8b5cf6; }
        .stat-btn.sog { background: #06b6d4; }
        .stat-btn.gb { background: #f59e0b; }
        .stat-btn.to { background: #ef4444; }
        .stat-btn.ct { background: #ec4899; }
        .stat-btn.save { background: #10b981; }
        .stat-btn.fow { background: #6366f1; }
        .stat-btn.fol { background: #f43f5e; }
        .stat-btn.pen { background: #dc2626; }
        .stat-btn.clear { background: #14b8a6; }

        .stat-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Recent Activity */
        .recent-activity {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #0f3460;
        }

        .activity-title {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .activity-list {
            max-height: 150px;
            overflow-y: auto;
        }

        .activity-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: #1a1a2e;
            border-radius: 6px;
            margin-bottom: 5px;
            font-size: 13px;
        }

        .activity-item .time {
            color: #94a3b8;
            font-size: 11px;
        }

        .activity-item .undo-btn {
            background: #ef4444;
            border: none;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        /* Box Score Panel */
        .box-score-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .box-score-table th,
        .box-score-table td {
            padding: 8px 4px;
            text-align: center;
            border-bottom: 1px solid #0f3460;
        }

        .box-score-table th {
            background: #0f3460;
            color: #94a3b8;
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        .box-score-table td:first-child {
            text-align: left;
            font-weight: 600;
        }

        .box-score-table tr:hover {
            background: #1a1a2e;
        }

        .box-score-container {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .team-header {
            padding: 10px;
            font-weight: 600;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .team-header.home { background: #1e3a5f; color: #3b82f6; }
        .team-header.away { background: #3d1f1f; color: #ef4444; }

        /* Quarter Score */
        .quarter-scores {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            padding: 15px;
            background: #1a1a2e;
            border-radius: 8px;
        }

        .quarter-score {
            text-align: center;
        }

        .quarter-score .label {
            font-size: 12px;
            color: #94a3b8;
        }

        .quarter-score .scores {
            font-size: 14px;
            margin-top: 5px;
        }

        .quarter-score .home { color: #3b82f6; }
        .quarter-score .away { color: #ef4444; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #16213e;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #0f3460;
        }

        .modal-title {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .modal-buttons .btn {
            flex: 1;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .score { font-size: 36px; }
            .clock { font-size: 28px; }
            .stat-buttons { grid-template-columns: repeat(3, 1fr); }
            .stat-btn { padding: 12px 8px; font-size: 11px; }
            .stat-btn .icon { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="score-display">
                <div class="team-score">
                    <div class="team-name" onclick="editTeamName('home')" id="homeTeamName">HOME</div>
                    <div class="score home-score" id="homeScore">0</div>
                </div>
                <div class="game-info">
                    <div class="period" id="periodDisplay">Q1</div>
                    <div class="clock stopped" id="clock">12:00</div>
                    <div class="clock-controls">
                        <button class="clock-btn btn-start" id="startBtn" onclick="startClock()">Start</button>
                        <button class="clock-btn btn-stop" id="stopBtn" onclick="stopClock()" style="display:none">Stop</button>
                        <button class="clock-btn btn-reset" onclick="resetClock()">Reset</button>
                        <button class="clock-btn btn-period" onclick="nextPeriod()">Next Q</button>
                    </div>
                </div>
                <div class="team-score">
                    <div class="team-name" onclick="editTeamName('away')" id="awayTeamName">AWAY</div>
                    <div class="score away-score" id="awayScore">0</div>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="showPanel('live')">Live Stats</button>
            <button class="nav-tab" onclick="showPanel('setup')">Setup</button>
            <button class="nav-tab" onclick="showPanel('boxscore')">Box Score</button>
            <button class="nav-tab" onclick="showPanel('games')">Games</button>
        </div>

        <!-- Setup Panel -->
        <div class="panel" id="setup-panel">
            <div class="panel-title">Game Setup</div>

            <div class="setup-section">
                <h3>Quarter Length (minutes)</h3>
                <div class="input-group">
                    <input type="number" id="quarterLength" value="12" min="1" max="20">
                    <button class="btn btn-primary" onclick="setQuarterLength()">Set</button>
                </div>
            </div>

            <div class="setup-section">
                <h3>Home Team Roster</h3>
                <div class="input-group">
                    <input type="text" id="homePlayerNum" placeholder="#" style="width:60px;flex:none">
                    <input type="text" id="homePlayerName" placeholder="Player Name">
                    <button class="btn btn-primary" onclick="addPlayer('home')">Add</button>
                </div>
                <div class="roster-list" id="homeRoster"></div>
            </div>

            <div class="setup-section">
                <h3>Away Team Roster</h3>
                <div class="input-group">
                    <input type="text" id="awayPlayerNum" placeholder="#" style="width:60px;flex:none">
                    <input type="text" id="awayPlayerName" placeholder="Player Name">
                    <button class="btn btn-primary" onclick="addPlayer('away')">Add</button>
                </div>
                <div class="roster-list" id="awayRoster"></div>
            </div>

            <div class="setup-section">
                <button class="btn btn-success" onclick="newGame()" style="width:100%">New Game</button>
            </div>
        </div>

        <!-- Live Stats Panel -->
        <div class="panel active" id="live-panel">
            <div class="team-toggle">
                <button class="home-btn active" onclick="selectTeam('home')" id="homeToggle">Home</button>
                <button class="away-btn" onclick="selectTeam('away')" id="awayToggle">Away</button>
            </div>

            <div class="player-grid" id="playerGrid"></div>

            <div class="stat-buttons">
                <button class="stat-btn goal" onclick="recordStat('G')">
                    <span class="icon">&#9917;</span>
                    Goal
                </button>
                <button class="stat-btn assist" onclick="recordStat('A')">
                    <span class="icon">&#128077;</span>
                    Assist
                </button>
                <button class="stat-btn shot" onclick="recordStat('S')">
                    <span class="icon">&#127919;</span>
                    Shot
                </button>
                <button class="stat-btn sog" onclick="recordStat('SOG')">
                    <span class="icon">&#10687;</span>
                    Shot on Goal
                </button>
                <button class="stat-btn gb" onclick="recordStat('GB')">
                    <span class="icon">&#9898;</span>
                    Ground Ball
                </button>
                <button class="stat-btn to" onclick="recordStat('TO')">
                    <span class="icon">&#10060;</span>
                    Turnover
                </button>
                <button class="stat-btn ct" onclick="recordStat('CT')">
                    <span class="icon">&#128170;</span>
                    Caused TO
                </button>
                <button class="stat-btn save" onclick="recordStat('SV')">
                    <span class="icon">&#128400;</span>
                    Save
                </button>
                <button class="stat-btn fow" onclick="recordStat('FOW')">
                    <span class="icon">&#9989;</span>
                    Faceoff W
                </button>
                <button class="stat-btn fol" onclick="recordStat('FOL')">
                    <span class="icon">&#10062;</span>
                    Faceoff L
                </button>
                <button class="stat-btn pen" onclick="recordStat('PEN')">
                    <span class="icon">&#128679;</span>
                    Penalty
                </button>
                <button class="stat-btn clear" onclick="recordStat('CLR')">
                    <span class="icon">&#10145;</span>
                    Clear
                </button>
            </div>

            <div class="recent-activity">
                <div class="activity-title">Recent Activity</div>
                <div class="activity-list" id="activityList"></div>
            </div>
        </div>

        <!-- Box Score Panel -->
        <div class="panel" id="boxscore-panel">
            <div class="panel-title">Box Score</div>

            <div class="team-header home" id="boxHomeTeam">HOME</div>
            <div class="box-score-container">
                <table class="box-score-table" id="homeBoxScore">
                    <thead>
                        <tr>
                            <th>Player</th>
                            <th>G</th>
                            <th>A</th>
                            <th>PTS</th>
                            <th>S</th>
                            <th>SOG</th>
                            <th>GB</th>
                            <th>TO</th>
                            <th>CT</th>
                            <th>SV</th>
                            <th>FO</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="team-header away" id="boxAwayTeam">AWAY</div>
            <div class="box-score-container">
                <table class="box-score-table" id="awayBoxScore">
                    <thead>
                        <tr>
                            <th>Player</th>
                            <th>G</th>
                            <th>A</th>
                            <th>PTS</th>
                            <th>S</th>
                            <th>SOG</th>
                            <th>GB</th>
                            <th>TO</th>
                            <th>CT</th>
                            <th>SV</th>
                            <th>FO</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="quarter-scores" id="quarterScores"></div>

            <div style="margin-top:15px">
                <button class="btn btn-primary" onclick="exportStats()" style="width:100%">Export Stats (CSV)</button>
            </div>
        </div>

        <!-- Games Panel -->
        <div class="panel" id="games-panel">
            <div class="panel-title">Saved Games</div>
            <div id="savedGamesList"></div>
            <div style="margin-top:15px">
                <button class="btn btn-success" onclick="saveGame()" style="width:100%;margin-bottom:10px">Save Current Game</button>
                <button class="btn btn-danger" onclick="clearAllData()" style="width:100%">Clear All Data</button>
            </div>
        </div>
    </div>

    <!-- Team Name Modal -->
    <div class="modal" id="teamNameModal">
        <div class="modal-content">
            <div class="modal-title">Edit Team Name</div>
            <input type="text" id="teamNameInput" style="width:100%;padding:10px;border-radius:6px;border:1px solid #0f3460;background:#1a1a2e;color:#fff">
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveTeamName()">Save</button>
            </div>
        </div>
    </div>

    <script>
        // Game State
        let gameState = {
            homeTeam: 'HOME',
            awayTeam: 'AWAY',
            homeRoster: [],
            awayRoster: [],
            homeStats: {},
            awayStats: {},
            quarterLength: 12 * 60,
            currentPeriod: 1,
            timeRemaining: 12 * 60,
            isRunning: false,
            quarterScores: { home: [0, 0, 0, 0], away: [0, 0, 0, 0] },
            activities: []
        };

        let selectedTeam = 'home';
        let selectedPlayer = null;
        let clockInterval = null;
        let editingTeam = null;

        // Initialize
        function init() {
            loadState();
            updateDisplay();
            renderRosters();
            renderPlayerGrid();
            renderActivities();
            updateBoxScore();
            renderSavedGames();
        }

        // Local Storage
        function saveState() {
            localStorage.setItem('lacrosseGameState', JSON.stringify(gameState));
        }

        function loadState() {
            const saved = localStorage.getItem('lacrosseGameState');
            if (saved) {
                gameState = JSON.parse(saved);
            }
        }

        // Clock Functions
        function startClock() {
            if (gameState.isRunning) return;
            gameState.isRunning = true;
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline-block';
            document.getElementById('clock').classList.remove('stopped');

            clockInterval = setInterval(() => {
                if (gameState.timeRemaining > 0) {
                    gameState.timeRemaining--;
                    updateClockDisplay();
                    saveState();
                } else {
                    stopClock();
                }
            }, 1000);
        }

        function stopClock() {
            gameState.isRunning = false;
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('clock').classList.add('stopped');

            if (clockInterval) {
                clearInterval(clockInterval);
                clockInterval = null;
            }
            saveState();
        }

        function resetClock() {
            stopClock();
            gameState.timeRemaining = gameState.quarterLength;
            updateClockDisplay();
            saveState();
        }

        function nextPeriod() {
            if (gameState.currentPeriod < 4) {
                gameState.currentPeriod++;
            } else if (gameState.currentPeriod >= 4) {
                gameState.currentPeriod++;
            }
            resetClock();
            updateDisplay();
            saveState();
        }

        function updateClockDisplay() {
            const minutes = Math.floor(gameState.timeRemaining / 60);
            const seconds = gameState.timeRemaining % 60;
            document.getElementById('clock').textContent =
                `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function setQuarterLength() {
            const mins = parseInt(document.getElementById('quarterLength').value) || 12;
            gameState.quarterLength = mins * 60;
            gameState.timeRemaining = gameState.quarterLength;
            updateClockDisplay();
            saveState();
        }

        // Team Functions
        function editTeamName(team) {
            editingTeam = team;
            document.getElementById('teamNameInput').value =
                team === 'home' ? gameState.homeTeam : gameState.awayTeam;
            document.getElementById('teamNameModal').classList.add('show');
            document.getElementById('teamNameInput').focus();
        }

        function saveTeamName() {
            const name = document.getElementById('teamNameInput').value.trim() ||
                (editingTeam === 'home' ? 'HOME' : 'AWAY');

            if (editingTeam === 'home') {
                gameState.homeTeam = name;
            } else {
                gameState.awayTeam = name;
            }

            closeModal();
            updateDisplay();
            saveState();
        }

        function closeModal() {
            document.getElementById('teamNameModal').classList.remove('show');
            editingTeam = null;
        }

        function selectTeam(team) {
            selectedTeam = team;
            selectedPlayer = null;

            document.getElementById('homeToggle').classList.toggle('active', team === 'home');
            document.getElementById('awayToggle').classList.toggle('active', team === 'away');

            renderPlayerGrid();
        }

        // Player/Roster Functions
        function addPlayer(team) {
            const numInput = document.getElementById(`${team}PlayerNum`);
            const nameInput = document.getElementById(`${team}PlayerName`);

            const num = numInput.value.trim();
            const name = nameInput.value.trim() || `Player ${num}`;

            if (!num) return;

            const roster = team === 'home' ? gameState.homeRoster : gameState.awayRoster;
            const stats = team === 'home' ? gameState.homeStats : gameState.awayStats;

            if (!roster.find(p => p.num === num)) {
                roster.push({ num, name });
                stats[num] = { G: 0, A: 0, S: 0, SOG: 0, GB: 0, TO: 0, CT: 0, SV: 0, FOW: 0, FOL: 0, PEN: 0, CLR: 0 };
            }

            numInput.value = '';
            nameInput.value = '';
            numInput.focus();

            renderRosters();
            renderPlayerGrid();
            saveState();
        }

        function removePlayer(team, num) {
            const roster = team === 'home' ? gameState.homeRoster : gameState.awayRoster;
            const idx = roster.findIndex(p => p.num === num);
            if (idx !== -1) {
                roster.splice(idx, 1);
            }
            renderRosters();
            renderPlayerGrid();
            saveState();
        }

        function renderRosters() {
            ['home', 'away'].forEach(team => {
                const roster = team === 'home' ? gameState.homeRoster : gameState.awayRoster;
                const container = document.getElementById(`${team}Roster`);

                container.innerHTML = roster.map(p => `
                    <div class="roster-item">
                        <div><span class="number">#${p.num}</span>${p.name}</div>
                        <button class="remove-btn" onclick="removePlayer('${team}', '${p.num}')">&times;</button>
                    </div>
                `).join('');
            });
        }

        function renderPlayerGrid() {
            const roster = selectedTeam === 'home' ? gameState.homeRoster : gameState.awayRoster;
            const container = document.getElementById('playerGrid');

            if (roster.length === 0) {
                container.innerHTML = '<div style="color:#94a3b8;text-align:center;padding:20px">No players added. Go to Setup to add players.</div>';
                return;
            }

            container.innerHTML = roster.map(p => `
                <button class="player-btn ${selectedPlayer === p.num ? 'selected' : ''}"
                        onclick="selectPlayer('${p.num}')">
                    <span class="num">${p.num}</span>
                    <span class="name">${p.name}</span>
                </button>
            `).join('');
        }

        function selectPlayer(num) {
            selectedPlayer = selectedPlayer === num ? null : num;
            renderPlayerGrid();
        }

        // Stat Recording
        function recordStat(stat) {
            if (!selectedPlayer) {
                alert('Select a player first');
                return;
            }

            const stats = selectedTeam === 'home' ? gameState.homeStats : gameState.awayStats;
            const roster = selectedTeam === 'home' ? gameState.homeRoster : gameState.awayRoster;
            const player = roster.find(p => p.num === selectedPlayer);

            if (!stats[selectedPlayer]) {
                stats[selectedPlayer] = { G: 0, A: 0, S: 0, SOG: 0, GB: 0, TO: 0, CT: 0, SV: 0, FOW: 0, FOL: 0, PEN: 0, CLR: 0 };
            }

            stats[selectedPlayer][stat]++;

            // Update score for goals
            if (stat === 'G') {
                const period = Math.min(gameState.currentPeriod, 4) - 1;
                if (selectedTeam === 'home') {
                    gameState.quarterScores.home[period]++;
                } else {
                    gameState.quarterScores.away[period]++;
                }
            }

            // Add to activity log
            const minutes = Math.floor(gameState.timeRemaining / 60);
            const seconds = gameState.timeRemaining % 60;
            const timeStr = `${minutes}:${seconds.toString().padStart(2, '0')}`;

            gameState.activities.unshift({
                id: Date.now(),
                team: selectedTeam,
                player: selectedPlayer,
                playerName: player?.name || selectedPlayer,
                stat: stat,
                period: gameState.currentPeriod,
                time: timeStr
            });

            // Keep only last 50 activities
            gameState.activities = gameState.activities.slice(0, 50);

            updateDisplay();
            renderActivities();
            updateBoxScore();
            saveState();
        }

        function undoStat(activityId) {
            const idx = gameState.activities.findIndex(a => a.id === activityId);
            if (idx === -1) return;

            const activity = gameState.activities[idx];
            const stats = activity.team === 'home' ? gameState.homeStats : gameState.awayStats;

            if (stats[activity.player] && stats[activity.player][activity.stat] > 0) {
                stats[activity.player][activity.stat]--;

                // Update score for goals
                if (activity.stat === 'G') {
                    const period = Math.min(activity.period, 4) - 1;
                    if (activity.team === 'home') {
                        gameState.quarterScores.home[period] = Math.max(0, gameState.quarterScores.home[period] - 1);
                    } else {
                        gameState.quarterScores.away[period] = Math.max(0, gameState.quarterScores.away[period] - 1);
                    }
                }
            }

            gameState.activities.splice(idx, 1);

            updateDisplay();
            renderActivities();
            updateBoxScore();
            saveState();
        }

        function renderActivities() {
            const container = document.getElementById('activityList');
            const statNames = {
                G: 'Goal', A: 'Assist', S: 'Shot', SOG: 'Shot on Goal',
                GB: 'Ground Ball', TO: 'Turnover', CT: 'Caused TO',
                SV: 'Save', FOW: 'Faceoff Win', FOL: 'Faceoff Loss',
                PEN: 'Penalty', CLR: 'Clear'
            };

            container.innerHTML = gameState.activities.slice(0, 20).map(a => `
                <div class="activity-item">
                    <span>Q${a.period} ${a.time} - #${a.player} ${a.playerName}: ${statNames[a.stat] || a.stat}</span>
                    <button class="undo-btn" onclick="undoStat(${a.id})">Undo</button>
                </div>
            `).join('') || '<div style="color:#94a3b8;text-align:center;padding:10px">No activity yet</div>';
        }

        // Display Updates
        function updateDisplay() {
            document.getElementById('homeTeamName').textContent = gameState.homeTeam;
            document.getElementById('awayTeamName').textContent = gameState.awayTeam;
            document.getElementById('homeToggle').textContent = gameState.homeTeam;
            document.getElementById('awayToggle').textContent = gameState.awayTeam;
            document.getElementById('boxHomeTeam').textContent = gameState.homeTeam;
            document.getElementById('boxAwayTeam').textContent = gameState.awayTeam;

            // Calculate total scores
            const homeTotal = gameState.quarterScores.home.reduce((a, b) => a + b, 0);
            const awayTotal = gameState.quarterScores.away.reduce((a, b) => a + b, 0);

            document.getElementById('homeScore').textContent = homeTotal;
            document.getElementById('awayScore').textContent = awayTotal;

            // Period display
            let periodText = `Q${gameState.currentPeriod}`;
            if (gameState.currentPeriod > 4) {
                periodText = `OT${gameState.currentPeriod - 4}`;
            }
            document.getElementById('periodDisplay').textContent = periodText;

            updateClockDisplay();
            updateQuarterScores();
        }

        function updateQuarterScores() {
            const container = document.getElementById('quarterScores');
            let html = '';

            for (let i = 0; i < 4; i++) {
                html += `
                    <div class="quarter-score">
                        <div class="label">Q${i + 1}</div>
                        <div class="scores">
                            <span class="home">${gameState.quarterScores.home[i]}</span>
                            -
                            <span class="away">${gameState.quarterScores.away[i]}</span>
                        </div>
                    </div>
                `;
            }

            // Final totals
            const homeTotal = gameState.quarterScores.home.reduce((a, b) => a + b, 0);
            const awayTotal = gameState.quarterScores.away.reduce((a, b) => a + b, 0);

            html += `
                <div class="quarter-score">
                    <div class="label">Final</div>
                    <div class="scores">
                        <span class="home">${homeTotal}</span>
                        -
                        <span class="away">${awayTotal}</span>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        function updateBoxScore() {
            ['home', 'away'].forEach(team => {
                const roster = team === 'home' ? gameState.homeRoster : gameState.awayRoster;
                const stats = team === 'home' ? gameState.homeStats : gameState.awayStats;
                const tbody = document.querySelector(`#${team}BoxScore tbody`);

                if (roster.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;color:#94a3b8">No players</td></tr>';
                    return;
                }

                let totals = { G: 0, A: 0, S: 0, SOG: 0, GB: 0, TO: 0, CT: 0, SV: 0, FOW: 0, FOL: 0 };

                let html = roster.map(p => {
                    const s = stats[p.num] || { G: 0, A: 0, S: 0, SOG: 0, GB: 0, TO: 0, CT: 0, SV: 0, FOW: 0, FOL: 0 };
                    const pts = s.G + s.A;
                    const fo = `${s.FOW}-${s.FOL}`;

                    Object.keys(totals).forEach(k => totals[k] += (s[k] || 0));

                    return `
                        <tr>
                            <td>#${p.num} ${p.name}</td>
                            <td>${s.G}</td>
                            <td>${s.A}</td>
                            <td>${pts}</td>
                            <td>${s.S}</td>
                            <td>${s.SOG}</td>
                            <td>${s.GB}</td>
                            <td>${s.TO}</td>
                            <td>${s.CT}</td>
                            <td>${s.SV}</td>
                            <td>${fo}</td>
                        </tr>
                    `;
                }).join('');

                // Totals row
                html += `
                    <tr style="font-weight:bold;background:#0f3460">
                        <td>TOTALS</td>
                        <td>${totals.G}</td>
                        <td>${totals.A}</td>
                        <td>${totals.G + totals.A}</td>
                        <td>${totals.S}</td>
                        <td>${totals.SOG}</td>
                        <td>${totals.GB}</td>
                        <td>${totals.TO}</td>
                        <td>${totals.CT}</td>
                        <td>${totals.SV}</td>
                        <td>${totals.FOW}-${totals.FOL}</td>
                    </tr>
                `;

                tbody.innerHTML = html;
            });
        }

        // Panel Navigation
        function showPanel(panel) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));

            document.getElementById(`${panel}-panel`).classList.add('active');
            event.target.classList.add('active');

            if (panel === 'boxscore') {
                updateBoxScore();
            }
        }

        // Game Management
        function newGame() {
            if (!confirm('Start a new game? Current stats will be saved.')) return;

            saveGame();

            gameState.homeStats = {};
            gameState.awayStats = {};
            gameState.currentPeriod = 1;
            gameState.timeRemaining = gameState.quarterLength;
            gameState.quarterScores = { home: [0, 0, 0, 0], away: [0, 0, 0, 0] };
            gameState.activities = [];

            // Reset stats for existing roster
            gameState.homeRoster.forEach(p => {
                gameState.homeStats[p.num] = { G: 0, A: 0, S: 0, SOG: 0, GB: 0, TO: 0, CT: 0, SV: 0, FOW: 0, FOL: 0, PEN: 0, CLR: 0 };
            });
            gameState.awayRoster.forEach(p => {
                gameState.awayStats[p.num] = { G: 0, A: 0, S: 0, SOG: 0, GB: 0, TO: 0, CT: 0, SV: 0, FOW: 0, FOL: 0, PEN: 0, CLR: 0 };
            });

            stopClock();
            updateDisplay();
            renderActivities();
            updateBoxScore();
            saveState();
            showPanel('live');
        }

        function saveGame() {
            const games = JSON.parse(localStorage.getItem('lacrosseSavedGames') || '[]');
            const homeTotal = gameState.quarterScores.home.reduce((a, b) => a + b, 0);
            const awayTotal = gameState.quarterScores.away.reduce((a, b) => a + b, 0);

            games.unshift({
                id: Date.now(),
                date: new Date().toLocaleDateString(),
                homeTeam: gameState.homeTeam,
                awayTeam: gameState.awayTeam,
                homeScore: homeTotal,
                awayScore: awayTotal,
                state: JSON.parse(JSON.stringify(gameState))
            });

            localStorage.setItem('lacrosseSavedGames', JSON.stringify(games.slice(0, 20)));
            renderSavedGames();
            alert('Game saved!');
        }

        function loadGame(gameId) {
            const games = JSON.parse(localStorage.getItem('lacrosseSavedGames') || '[]');
            const game = games.find(g => g.id === gameId);

            if (game) {
                gameState = game.state;
                stopClock();
                updateDisplay();
                renderRosters();
                renderPlayerGrid();
                renderActivities();
                updateBoxScore();
                saveState();
                showPanel('live');
            }
        }

        function deleteGame(gameId) {
            if (!confirm('Delete this saved game?')) return;

            let games = JSON.parse(localStorage.getItem('lacrosseSavedGames') || '[]');
            games = games.filter(g => g.id !== gameId);
            localStorage.setItem('lacrosseSavedGames', JSON.stringify(games));
            renderSavedGames();
        }

        function renderSavedGames() {
            const games = JSON.parse(localStorage.getItem('lacrosseSavedGames') || '[]');
            const container = document.getElementById('savedGamesList');

            if (games.length === 0) {
                container.innerHTML = '<div style="color:#94a3b8;text-align:center;padding:20px">No saved games</div>';
                return;
            }

            container.innerHTML = games.map(g => `
                <div class="roster-item" style="margin-bottom:10px">
                    <div>
                        <div style="font-weight:bold">${g.homeTeam} ${g.homeScore} - ${g.awayScore} ${g.awayTeam}</div>
                        <div style="font-size:12px;color:#94a3b8">${g.date}</div>
                    </div>
                    <div>
                        <button class="btn btn-secondary" onclick="loadGame(${g.id})" style="padding:5px 10px;font-size:12px">Load</button>
                        <button class="btn btn-danger" onclick="deleteGame(${g.id})" style="padding:5px 10px;font-size:12px;margin-left:5px">Del</button>
                    </div>
                </div>
            `).join('');
        }

        function clearAllData() {
            if (!confirm('Clear ALL data including saved games? This cannot be undone!')) return;

            localStorage.removeItem('lacrosseGameState');
            localStorage.removeItem('lacrosseSavedGames');
            location.reload();
        }

        // Export
        function exportStats() {
            let csv = 'Team,Number,Name,G,A,PTS,S,SOG,GB,TO,CT,SV,FOW,FOL,PEN,CLR\n';

            ['home', 'away'].forEach(team => {
                const roster = team === 'home' ? gameState.homeRoster : gameState.awayRoster;
                const stats = team === 'home' ? gameState.homeStats : gameState.awayStats;
                const teamName = team === 'home' ? gameState.homeTeam : gameState.awayTeam;

                roster.forEach(p => {
                    const s = stats[p.num] || {};
                    csv += `${teamName},${p.num},"${p.name}",${s.G||0},${s.A||0},${(s.G||0)+(s.A||0)},${s.S||0},${s.SOG||0},${s.GB||0},${s.TO||0},${s.CT||0},${s.SV||0},${s.FOW||0},${s.FOL||0},${s.PEN||0},${s.CLR||0}\n`;
                });
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `lacrosse_stats_${gameState.homeTeam}_vs_${gameState.awayTeam}_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', e => {
            if (e.target.tagName === 'INPUT') return;

            if (e.code === 'Space') {
                e.preventDefault();
                gameState.isRunning ? stopClock() : startClock();
            }
        });

        // Enter key for forms
        document.getElementById('homePlayerName').addEventListener('keydown', e => {
            if (e.key === 'Enter') addPlayer('home');
        });
        document.getElementById('awayPlayerName').addEventListener('keydown', e => {
            if (e.key === 'Enter') addPlayer('away');
        });
        document.getElementById('teamNameInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') saveTeamName();
        });

        // Initialize on load
        init();
    </script>
</body>
</html>
